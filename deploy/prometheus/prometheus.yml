global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/llm-observability-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: llm-observability
    metrics_path: /metrics
    static_configs:
      - targets: ["ingress:4318"]
