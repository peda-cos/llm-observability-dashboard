# Production-shaped OTel Collector gateway.
#
# The local TypeScript ingress (src/ingest) implements the same
# receive -> archive -> tail-sample -> persist contract so the demo runs
# without Docker. Use this file when you want the collector-contrib
# ClickHouse/S3 exporters in front of the canonical store.
#
# Note: the contrib ClickHouse exporter writes its own otel_traces schema.
# The canonical `observability.spans` schema in db/clickhouse/schema.sql is
# written by the application exporter (CLICKHOUSE_URL in .env.example), or by
# adapting this pipeline with a transform processor.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 2000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # PII retention is implemented by the local TypeScript tail sampler,
      # which inspects completion content before the decision. To mirror it
      # here, emit a boolean pii.completion attribute and add:
      # - name: pii-flagged
      #   type: string_attribute
      #   string_attribute: {key: pii.completion, values: ["true", "1"]}
      - name: successes
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: observability
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    traces_table_name: otel_traces
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 4
      batch:
        min_size: 5000
        flush_timeout: 5s
  awss3:
    s3uploader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:OBS_ARCHIVE_BUCKET}
      s3_prefix: raw-traces
      s3_partition_format: "%Y/%m/%d/%H"
      compression: gzip
      s3_force_path_style: true
    timeout: 20s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling]
      exporters: [clickhouse, awss3]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
